<div class="language-switch">
  <button
    type="button"
    [class.active]="currentLanguage === 'bs'"
    (click)="setLanguage('bs')">
      <svg
        class="flag"
        viewBox="0 0 60 30"
        aria-hidden="true">
        <rect width="60" height="30" fill="#002f6c" />
        <polygon points="14,0 60,0 60,30" fill="#fecb00" />
        <g fill="#ffffff">
        <polygon points="-1.0,-6.3 -0.4,-4.8 1.2,-4.7 -0.1,-3.7 0.4,-2.1 -1.0,-3.0 -2.4,-2.1 -1.9,-3.7 -3.2,-4.7 -1.6,-4.8" />
        <polygon points="4.8,-1.8 5.3,-0.3 6.9,-0.2 5.7,0.8 6.1,2.4 4.8,1.5 3.4,2.4 3.8,0.8 2.6,-0.2 4.2,-0.3" />
        <polygon points="10.5,2.7 11.1,4.2 12.7,4.3 11.4,5.3 11.9,6.9 10.5,6.0 9.1,6.9 9.6,5.3 8.3,4.3 9.9,4.2" />
        <polygon points="16.2,7.2 16.8,8.7 18.4,8.8 17.2,9.8 17.6,11.4 16.2,10.5 14.9,11.4 15.3,9.8 14.1,8.8 15.7,8.7" />
        <polygon points="22.0,11.7 22.6,13.2 24.2,13.3 22.9,14.3 23.4,15.9 22.0,15.0 20.6,15.9 21.1,14.3 19.8,13.3 21.4,13.2" />
        <polygon points="27.8,16.2 28.3,17.7 29.9,17.8 28.7,18.8 29.1,20.4 27.8,19.5 26.4,20.4 26.8,18.8 25.6,17.8 27.2,17.7" />
        <polygon points="33.5,20.7 34.1,22.2 35.7,22.3 34.4,23.3 34.9,24.9 33.5,24.0 32.1,24.9 32.6,23.3 31.3,22.3 32.9,22.2" />
        <polygon points="39.2,25.2 39.8,26.7 41.4,26.8 40.2,27.8 40.6,29.4 39.2,28.5 37.9,29.4 38.3,27.8 37.1,26.8 38.7,26.7" />
        <polygon points="45.0,29.7 45.6,31.2 47.2,31.3 45.9,32.3 46.4,33.9 45.0,33.0 43.6,33.9 44.1,32.3 42.8,31.3 44.4,31.2" />
        </g>
      </svg>

    BS
  </button>

  <button
    type="button"
    [class.active]="currentLanguage === 'en'"
    (click)="setLanguage('en')">
      <svg
        class="flag"
        viewBox="0 0 60 30"
        aria-hidden="true">
        <rect width="60" height="30" fill="#012169" />
        <path
          d="M0,0 60,30 M60,0 0,30"
          stroke="#ffffff"
          stroke-width="6" />
        <path
          d="M0,0 60,30 M60,0 0,30"
          stroke="#c8102e"
          stroke-width="3" />
        <path
          d="M30,0 V30 M0,15 H60"
          stroke="#ffffff"
          stroke-width="10" />
        <path
          d="M30,0 V30 M0,15 H60"
          stroke="#c8102e"
          stroke-width="6" />
      </svg>

    EN
  </button>
</div>
